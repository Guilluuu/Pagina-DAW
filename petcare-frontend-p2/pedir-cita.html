<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="authors" content="Marina Collazo Couñago, Guillermo Fernández Castro, Andrés Daparte Cabo">
  <meta name="keywords" content="width=device-width, initial-scale=1.0">
  <title>PetCare | Pedir cita</title>
  <link rel="icon" type="image/x-icon" href="assets/imgs/logo.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/pedir-cita.css">
</head>


<body>
  <header class="header-formulario">
    <h1 class="titulo">Nombre de la clínica</h1>
    <address class="linea-flex ubicacion">
      <img class="icono-pequeno" src="assets/imgs/location-pin.svg">
      <span id="texto-ubicacion-cita">Ubicación de la clínica</span>
    </address>
  </header>

  <main>
    <form action="clinicas.html" method="get" target="_top">
      <fieldset class="fieldset fieldset-propietario">
        <input class="borde-asimetrico input-texto" type="text" id="nombre" name="nombre" required
          placeholder="Nombre completo">
        <section id="datos-contacto">
          <input class="borde-asimetrico input-texto" type="tel" id="telefono" name="telefono" required
            placeholder="Número de teléfono">
          <input class="borde-asimetrico input-texto" type="email" id="email" name="email" required
            placeholder="Correo electrónico">
        </section>
      </fieldset>

      <fieldset class="fieldset fieldset-mascota">
        <input class="borde-asimetrico input-texto" type="text" id="nombreMascota" name="nombreMascota" required
          placeholder="Nombre de la mascota">
        <label for="especie">Tipo de mascota</label>
        <section class="opciones-especie">
          <input type="radio" id="perro" name="especie" value="perro" required>
          <label class="borde-asimetrico" for="perro"><img class="icono-mascota" src="assets/imgs/dog-svgrepo-com.svg"
              alt="Perro"></label>
          <input type="radio" id="gato" name="especie" value="gato">
          <label class="borde-asimetrico" for="gato"><img class="icono-mascota" src="assets/imgs/cat-svgrepo-com.svg"
              alt="Gato"></label>
          <input type="radio" id="otro" name="especie" value="otro">
          <label class="borde-asimetrico" for="otro"><img class="icono-mascota" src="assets/imgs/mouse.svg"
              alt="Otro"></label>
        </section>
      </fieldset>

      <fieldset class="fieldset-cita fieldset">
        <section id="fecha">
          <label for="fecha">Fecha de la cita:</label>
          <input type="date" id="fecha" name="fecha" required>
        </section>
        <section id="hora">
          <label for="hora">Hora de la cita:</label>
          <input type="time" id="hora" name="hora" required>
        </section>
      </fieldset>
      <button class="borde-asimetrico boton-submit" type="submit"">Pedir cita</button>
    </form>
  </main>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/jquery-migrate-3.6.0.min.js"></script>
  <script src="assets/js/pedir-cita.js"></script>
</body>
</html>
