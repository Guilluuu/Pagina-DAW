<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="authors" content="Marina Collazo Couñago, Guillermo Fernández Castro, Andrés Daparte Cabo">
  <meta name="keywords" content="width=device-width, initial-scale=1.0">
  <title>Clínicas</title>
  <link rel="icon" type="image/x-icon" href="assets/imgs/logo.svg">

  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <script src="assets/js/bootstrap.bundle.min.js"></script>

  <link rel="stylesheet" href="assets/css/clinicas.css">
  <script src="assets/js/main.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/jquery-migrate-3.6.0.min.js"></script>
  <script src="assets/js/clinicas.js"></script>
</head>

<body>
  <nav class="main-navbar">
    <a class="main-logo" href="index.html"> <img src="assets/imgs/logo.svg" alt="logo PetCare"> PetCare </a>
    <a href="servicios.html"> Servicios</a>
    <a href="consejos.html"> Consejos de salud</a>
    <a href="sobre-nosotros.html"> Sobre Nosotros</a>
    <a class="pedir-cita-navbar borde-asimetrico" href="clinicas.html">Pedir cita</a>
    <a class="urgencias-navbar borde-asimetrico" href="urgencias.html">Urgencias</a>
    <button class="menu-hamburguesa-moviles">☰</button>
  </nav>


  <header class="header-busqueda bg-gradient-1">
    <h1>Encuentra tu clínica</h1>
    <p> Introduce información para encontrar tu clínica idónea </p>
    <search class="contenedor-busqueda">
      <form name="buscarClinica" class="formulario-busqueda">
        <input class="boton input-busqueda borde-asimetrico" type="search" placeholder="Encuentra tu clínica..."
          name="clinica">
        <button class="boton boton-buscar borde-asimetrico">
          <img src="assets/imgs/search-icon.svg" class="icono-pequeno" alt="Icono de búsqueda">
          Buscar
        </button>
      </form>
      <a href="clinicas.html" class="boton boton-reset filtro borde-asimetrico">
        <img class="icono-pequeno" src="assets/imgs/restart.svg" alt=""> Reestablecer
      </a>
      <menu class="contenedor-filtros">
        <li><button class="boton borde-asimetrico filtro">Ordenar alfabéticamente</button></li>
        <li><button class="boton borde-asimetrico filtro">Mostrar abiertas</button></li>
      </menu>
    </search>

  </header>

  <main>
    <ul class="contenedor-tarjetas"></ul>
  </main>

  <template id="molde-clinica">
    <li>
      <article class="tarjeta borde-asimetrico">
        <img class="foto-clinica foto-pequena" src="" alt="Foto clínica">
        <strong class="titulo-clinica">Nombre</strong>
        <address class="linea-flex ubicacion">
          <img class="icono-pequeno" src="assets/imgs/location-pin.svg">
          <span class="texto-ubicacion">Ubicación</span>
        </address>
        <p class="alerta-urgencias linea-flex filtro borde-asimetrico"> 
          <img class="icono-pequeno" src="assets/imgs/warning-icon.svg"> 
          Atiende urgencias
        </p>
        <hr class="separador-tarjeta">
        <p class="linea-flex horario">
          <img class="icono-pequeno" src="assets/imgs/clock-two.svg">
          Horario
          <time class="texto-horario">00:00</time>
        </p>
        <p class="linea-flex numero-telefono">
          <img class="icono-pequeno" src="assets/imgs/phone.svg"> 
          <span class="texto-telefono">Teléfono</span>
        </p>
        <a class="pedir-cita boton borde-asimetrico filtro" href="#modal-cita">Pedir cita</a>
      </article>
    </li>
  </template>

  <div id="modal-cita" class="modal">
    <div class="modal-contenido borde-asimetrico">
      <a href="#" class="cerrar-modal">&times;</a> 
      <iframe src="pedir-cita.html" title="Formulario de cita"></iframe>
    </div>
  </div>
</body>

</html>
