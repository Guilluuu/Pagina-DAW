<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCare - Pedir Cita</title>
    <link rel="icon" type="image/x-icon" href="assets/imgs/logo.svg">
    <link rel="stylesheet" href="assets/css/pedir-cita.css">

</head>

<body>
  <header class="header-formulario">
    <h1 class="titulo">Nombre de la clínica</h1>
    <address class="linea-flex ubicacion">
      <img class="icono-pequeno" src="assets/imgs/location-pin.svg">
      Ubicación de la clínica
    </address>     
  </header>

  <main>
    <form action="clinicas.html" method="get" target="_top">
      <fieldset class="fieldset fieldset-propietario">
        <input class="borde-asimetrico input-texto" type="text" id="nombre" name="nombre" required placeholder="Nombre completo">
        <div id="datos-contacto">
          <input class="borde-asimetrico input-texto" type="tel" id="telefono" name="telefono" required placeholder="Número de teléfono">
          <input class="borde-asimetrico input-texto" type="email" id="email" name="email" required placeholder="Correo electrónico">
        </div>
      </fieldset>

      <fieldset class="fieldset fieldset-mascota">
        <input class="borde-asimetrico input-texto" type="text" id="nombreMascota" name="nombreMascota" required placeholder="Nombre de la mascota">
        <label for="especie">Tipo de mascota</label>
        <div class="opciones-especie">
          <input type="radio" id="perro" name="especie" value="perro" required>
          <label class="borde-asimetrico" for="perro"><img class="icono-mascota" src="assets/imgs/dog-svgrepo-com.svg" alt="Perro"></label>
          <input type="radio" id="gato" name="especie" value="gato">
          <label class="borde-asimetrico" for="gato"><img class="icono-mascota" src="assets/imgs/cat-svgrepo-com.svg" alt="Gato"></label>
          <input type="radio" id="otro" name="especie" value="otro">
          <label class="borde-asimetrico" for="otro"><img class="icono-mascota" src="assets/imgs/mouse.svg" alt="Otro"></label>
        </div>
      </fieldset>

      <fieldset class="fieldset-cita fieldset">
        <div id="fecha">
          <label for="fecha">Fecha de la cita:</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>
        <div id="hora">
          <label for="hora">Hora de la cita:</label>
          <input type="time" id="hora" name="hora" required>
        </div>
      </fieldset>
      <button class="borde-asimetrico boton-submit" type="submit"">Pedir cita</button>
    </form>
  </main>
</body>
</html>
